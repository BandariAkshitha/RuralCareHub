<!DOCTYPE html>
<html>
<head>
    <title>Prescriptions - RuralCareHub</title>

    <style>
        body{
            font-family:Arial,sans-serif;
            background:#f4f7fb;
            margin:0;
        }

        .header{
            background:#0077cc;
            color:white;
            text-align:center;
            padding:20px;
        }

        .language{
            text-align:right;
            margin:20px;
        }

        table{
            width:90%;
            margin:30px auto;
            border-collapse:collapse;
            background:white;
        }

        th,td{
            border:1px solid #ddd;
            padding:12px;
            text-align:center;
        }

        th{
            background:#0077cc;
            color:white;
        }

        tr:nth-child(even){
            background:#f2f2f2;
        }

        .back{
            display:block;
            width:150px;
            margin:20px auto;
            text-align:center;
            padding:10px;
            background:#28a745;
            color:white;
            text-decoration:none;
            border-radius:5px;
        }
    </style>
</head>

<body>

<div class="header">
    <h1 id="title">Patient Prescriptions</h1>
</div>

<div class="language">
    <select id="language" onchange="changeLanguage()">
        <option value="en">English</option>
        <option value="hi">हिन्दी</option>
        <option value="te">తెలుగు</option>
    </select>
</div>

<table>

<tr>
    <th id="patient">Patient</th>
    <th id="doctor">Doctor</th>
    <th id="symptoms">Symptoms</th>
    <th id="medicine">Medicine</th>
    <th id="dosage">Dosage</th>
</tr>

{% for p in prescriptions %}
<tr>
    <td>{{ p.patient_name }}</td>
    <td>{{ p.doctor_name }}</td>
    <td>{{ p.symptoms }}</td>
    <td>{{ p.medicine }}</td>
    <td>{{ p.dosage }}</td>
</tr>
{% endfor %}

</table>

<a href="/patient" class="back" id="back">Back</a>

<script>

const translations = {

en:{
title:"Patient Prescriptions",
patient:"Patient",
doctor:"Doctor",
symptoms:"Symptoms",
medicine:"Medicine",
dosage:"Dosage",
back:"Back"
},

hi:{
title:"रोगी की पर्चियाँ",
patient:"रोगी",
doctor:"डॉक्टर",
symptoms:"लक्षण",
medicine:"दवा",
dosage:"खुराक",
back:"वापस"
},

te:{
title:"రోగి ప్రిస్క్రిప్షన్లు",
patient:"రోగి",
doctor:"వైద్యుడు",
symptoms:"లక్షణాలు",
medicine:"మందు",
dosage:"మోతాదు",
back:"వెనక్కి"
}

};

// CHANGE LANGUAGE
function changeLanguage(){

let lang = document.getElementById("language").value;

document.getElementById("title").innerText = translations[lang].title;
document.getElementById("patient").innerText = translations[lang].patient;
document.getElementById("doctor").innerText = translations[lang].doctor;
document.getElementById("symptoms").innerText = translations[lang].symptoms;
document.getElementById("medicine").innerText = translations[lang].medicine;
document.getElementById("dosage").innerText = translations[lang].dosage;
document.getElementById("back").innerText = translations[lang].back;

// SAVE LANGUAGE
localStorage.setItem("lang", lang);
}

// AUTO LOAD SAVED LANGUAGE
window.onload = function(){
    let lang = localStorage.getItem("lang") || "en";
    document.getElementById("language").value = lang;
    changeLanguage();
}

</script>

</body>
</html>
