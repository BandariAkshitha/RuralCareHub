<!DOCTYPE html>
<html>
<head>
<title>Patient Feedback - RuralCareHub</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fa;
}

.top-bar{
    display:flex;
    justify-content:flex-end;
    padding:15px;
    background:white;
}

.dark-btn{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    background:black;
    color:white;
    cursor:pointer;
    margin-right:10px;
}

.container{
    width:50%;
    margin:30px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
}

h2{
    text-align:center;
    color:#0052d4;
}

label{
    font-weight:bold;
}

input,select,textarea{
    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:20px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;
}

textarea{
    resize:none;
}

button{
    width:100%;
    padding:12px;
    background:#0052d4;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#003ea8;
}

.back-btn{
    display:block;
    text-align:center;
    text-decoration:none;
    background:#28a745;
    color:white;
    padding:12px;
    border-radius:8px;
    margin-top:20px;
    font-weight:bold;
}

.back-btn:hover{
    background:#1f7d34;
}

.message{
    color:green;
    text-align:center;
    font-weight:bold;
}

.dark-mode{
    background:#121212;
    color:white;
}

.dark-mode .container{
    background:#1f1f1f;
    color:white;
}

</style>
</head>

<body>

<div class="top-bar">

<button onclick="toggleDarkMode()" class="dark-btn">
🌙 Dark Mode
</button>

<select id="languageSelect" onchange="changeLanguage()">
<option value="en">English</option>
<option value="hi">हिंदी</option>
<option value="te">తెలుగు</option>
</select>

</div>

<div class="container">

<h2 id="title">Patient Feedback</h2>

{% with messages = get_flashed_messages() %}
{% if messages %}
{% for message in messages %}
<p class="message">{{ message }}</p>
{% endfor %}
{% endif %}
{% endwith %}

<form action="/submit_feedback" method="POST">

<label id="nameLabel">Patient Name</label>
<input type="text" name="name" required>

<label id="ratingLabel">Rating</label>

<select name="rating" required>
<option value="5">⭐⭐⭐⭐⭐ Excellent</option>
<option value="4">⭐⭐⭐⭐ Good</option>
<option value="3">⭐⭐⭐ Average</option>
<option value="2">⭐⭐ Poor</option>
<option value="1">⭐ Very Poor</option>
</select>

<label id="commentLabel">Comments</label>

<textarea name="comment" rows="5" required></textarea>

<button type="submit" id="submitBtn">
Submit Feedback
</button>

</form>

<a href="/admin_dashboard" class="back-btn" id="backBtn">
⬅ Back to Dashboard
</a>

</div>

<script>

const translations={

en:{
title:"Patient Feedback",
name:"Patient Name",
rating:"Rating",
comment:"Comments",
submit:"Submit Feedback",
back:"⬅ Back to Dashboard"
},

hi:{
title:"रोगी फीडबैक",
name:"रोगी का नाम",
rating:"रेटिंग",
comment:"टिप्पणी",
submit:"फीडबैक जमा करें",
back:"⬅ डैशबोर्ड पर वापस जाएँ"
},

te:{
title:"రోగి అభిప్రాయం",
name:"రోగి పేరు",
rating:"రేటింగ్",
comment:"వ్యాఖ్య",
submit:"ఫీడ్‌బ్యాక్ పంపండి",
back:"⬅ డాష్‌బోర్డ్‌కు తిరిగి వెళ్ళండి"
}

};

function changeLanguage(){

let lang=document.getElementById("languageSelect").value;

localStorage.setItem("language",lang);

applyLanguage(lang);

}

function applyLanguage(lang){

document.getElementById("title").innerHTML=translations[lang].title;

document.getElementById("nameLabel").innerHTML=translations[lang].name;

document.getElementById("ratingLabel").innerHTML=translations[lang].rating;

document.getElementById("commentLabel").innerHTML=translations[lang].comment;

document.getElementById("submitBtn").innerHTML=translations[lang].submit;

document.getElementById("backBtn").innerHTML=translations[lang].back;

}

window.onload=function(){

let lang=localStorage.getItem("language")||"en";

document.getElementById("languageSelect").value=lang;

applyLanguage(lang);

}

function toggleDarkMode(){

document.body.classList.toggle("dark-mode");

}

</script>

</body>
</html>
