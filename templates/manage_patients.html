<!DOCTYPE html>
<html>
<head>

<title>Manage Patients</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f4f7fa;
}

.header{
    background:linear-gradient(to right,#0052d4,#00c6ff);
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:90%;
    margin:30px auto;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

th,td{
    padding:15px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

th{
    background:#007bff;
    color:white;
}

tr:hover{
    background:#f1f1f1;
}

.back-btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 20px;
    background:#007bff;
    color:white;
    text-decoration:none;
    border-radius:8px;
}

select{
    padding:10px;
    border-radius:8px;
    border:none;
    margin-top:10px;
}

footer{
    background:#0052d4;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:40px;
}

</style>

</head>

<body>

<div class="header">

<h1 id="title">Manage Patients</h1>

<p id="subtitle">

Admin Patient Management Panel

</p>

<select id="languageSelect"
onchange="changeLanguage()">

<option value="en">English</option>

<option value="hi">हिंदी</option>

<option value="te">తెలుగు</option>

</select>

</div>

<div class="container">

<table>

<tr>

<th>ID</th>

<th id="nameText">Patient Name</th>

<th>Email</th>

<th>Phone</th>

</tr>

{% for user in users %}

<tr>

<td>{{ user.id }}</td>

<td>{{ user.name }}</td>

<td>{{ user.email }}</td>

<td>{{ user.phone }}</td>

</tr>

{% endfor %}

</table>

<a href="/admin"
class="back-btn"
id="backBtn">

⬅ Back to Dashboard

</a>

</div>

<footer>

© 2026 RuralCareHub

</footer>

<script>

const translations = {

en: {

title:"Manage Patients",

subtitle:"Admin Patient Management Panel",

name:"Patient Name",

back:"Back to Dashboard"

},

hi: {

title:"मरीज प्रबंधन",

subtitle:"एडमिन मरीज प्रबंधन पैनल",

name:"मरीज का नाम",

back:"डैशबोर्ड पर वापस जाएं"

},

te: {

title:"రోగుల నిర్వహణ",

subtitle:"అడ్మిన్ పేషెంట్ మేనేజ్‌మెంట్ ప్యానెల్",

name:"రోగి పేరు",

back:"డాష్‌బోర్డ్‌కు వెళ్ళు"

}

};


function changeLanguage(){

let lang =
document.getElementById("languageSelect").value;

localStorage.setItem("language", lang);

applyLanguage(lang);

}


function applyLanguage(lang){

document.getElementById("title").innerHTML =
translations[lang].title;

document.getElementById("subtitle").innerHTML =
translations[lang].subtitle;

document.getElementById("nameText").innerHTML =
translations[lang].name;

document.getElementById("backBtn").innerHTML =
"⬅ " + translations[lang].back;

}


window.onload = function(){

let savedLang =
localStorage.getItem("language") || "en";

document.getElementById("languageSelect").value =
savedLang;

applyLanguage(savedLang);

};

</script>

</body>
</html>
