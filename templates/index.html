<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>RuralCareHub</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef5fb;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.header{
    background:linear-gradient(to right,#0056b3,#0077b6);
    color:white;
    text-align:center;
    padding:20px;
}

.logo{
    width:140px;
    height:140px;
    border-radius:50%;
}

.header h1{
    margin:10px 0 5px;
    font-size:40px;
}

.header p{
    margin:0;
    font-size:18px;
}

.login-box{
    width:400px;
    max-width:90%;
    background:white;
    margin:40px auto;
    padding:30px;
    border-radius:15px;
    box-shadow:0px 0px 15px rgba(0,0,0,0.2);
}

.login-box h2{
    text-align:center;
    color:#0056b3;
    margin-bottom:25px;
}

.btn-login{
    width:100%;
    padding:14px;
    background:#0056d6;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    margin-bottom:15px;
}

.btn-login:hover{
    background:#0045aa;
}

.or{
    text-align:center;
    margin:20px 0;
    color:gray;
}

.btn-signup{
    width:100%;
    padding:14px;
    background:#28a745;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

.btn-signup:hover{
    background:#218838;
}

.footer{
    background:#0056b3;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:40px;
}

a{
    text-decoration:none;
}

@media(max-width:768px){

    .header h1{
        font-size:30px;
    }

    .header p{
        font-size:15px;
    }

    .logo{
        width:120px;
        height:120px;
    }

    .login-box{
        width:90%;
        padding:20px;
    }

}

</style>

</head>

<body>

<div class="header">

    <img src="{{ url_for('static', filename='logo.jpeg') }}"
         alt="RuralCareHub Logo"
         class="logo">

    <h1 id="title">
        RuralCareHub
    </h1>

    <p id="subtitle">
        Connecting Communities to Health
    </p>

    <br>

    <select id="language-selector"
            style="padding:8px;
                   border-radius:6px;">

        <option value="en">English</option>

        <option value="hi">Hindi</option>

        <option value="te">Telugu</option>

    </select>

</div>

<div class="login-box">

    <h2 id="login-title">
        Select Dashboard
    </h2>

    <a href="/patient">

        <button class="btn-login"
                id="patient-btn">

            👤 Patient Dashboard

        </button>

    </a>

    <a href="/doctor">

        <button class="btn-login"
                id="doctor-btn">

            👨‍⚕️ Doctor Dashboard

        </button>

    </a>

    <a href="/admin">

        <button class="btn-login"
                id="admin-btn">

            🛡️ Admin Dashboard

        </button>

    </a>

    <div class="or">
        OR
    </div>

    <a href="/register">

        <button class="btn-signup"
                id="signup-btn">

            Sign Up

        </button>

    </a>

</div>

<div class="footer">

    <p>
        Emergency Number: 108
    </p>

    <p>
        Email: support@ruralcarehub.com
    </p>

    <p>
        © 2026 RuralCareHub. All Rights Reserved.
    </p>

</div>

<script>

const translations = {

    en: {
        title: "RuralCareHub",
        subtitle: "Connecting Communities to Health",
        loginTitle: "Select Dashboard",
        patient: "Patient Dashboard",
        doctor: "Doctor Dashboard",
        admin: "Admin Dashboard",
        signup: "Sign Up"
    },

    hi: {
        title: "रूरलकेयरहब",
        subtitle: "समुदायों को स्वास्थ्य से जोड़ना",
        loginTitle: "डैशबोर्ड चुनें",
        patient: "मरीज डैशबोर्ड",
        doctor: "डॉक्टर डैशबोर्ड",
        admin: "एडमिन डैशबोर्ड",
        signup: "साइन अप"
    },

    te: {
        title: "రూరల్ కేర్ హబ్",
        subtitle: "సమాజాలను ఆరోగ్యంతో కలుపుతోంది",
        loginTitle: "డాష్‌బోర్డ్ ఎంచుకోండి",
        patient: "రోగి డాష్‌బోర్డ్",
        doctor: "డాక్టర్ డాష్‌బోర్డ్",
        admin: "అడ్మిన్ డాష్‌బోర్డ్",
        signup: "సైన్ అప్"
    }

};

document.getElementById("language-selector")

.addEventListener("change", function () {

    let lang = this.value;

    document.getElementById("title").innerText =
    translations[lang].title;

    document.getElementById("subtitle").innerText =
    translations[lang].subtitle;

    document.getElementById("login-title").innerText =
    translations[lang].loginTitle;

    document.getElementById("patient-btn").innerText =
    "👤 " + translations[lang].patient;

    document.getElementById("doctor-btn").innerText =
    "👨‍⚕️ " + translations[lang].doctor;

    document.getElementById("admin-btn").innerText =
    "🛡️ " + translations[lang].admin;

    document.getElementById("signup-btn").innerText =
    translations[lang].signup;

});

</script>

</body>
</html>
