<!DOCTYPE html>
<html>
<head>
    <title>Health Records - RuralCareHub</title>

    <style>
        body{
            font-family:Arial, sans-serif;
            background:#f4f7fb;
            margin:0;
        }

        .header{
            background:#0077cc;
            color:white;
            text-align:center;
            padding:20px;
        }

        .container{
            width:80%;
            margin:30px auto;
        }

        .record-card{
            background:white;
            padding:20px;
            margin-bottom:20px;
            border-radius:10px;
            box-shadow:0 3px 10px rgba(0,0,0,0.1);
        }

        h3{
            color:#0077cc;
        }

        .back-btn{
            display:block;
            width:150px;
            text-align:center;
            margin:20px auto;
            padding:10px;
            background:#0077cc;
            color:white;
            text-decoration:none;
            border-radius:5px;
        }
    </style>
</head>

<body>

<div class="header">

    <h1 id="title">Health Records</h1>

    <br>

    <select id="languageSelect" onchange="changeLanguage()">

        <option value="en">English</option>

        <option value="hi">Hindi</option>

        <option value="te">Telugu</option>

    </select>

</div>

<div class="container">

    <div class="record-card">
        <h3 id="patient-details-title">Patient Details</h3>
        <p><strong id="name-label">Name:</strong> {{ record.patient_name }}</p>
        <p><strong id="age-label">Age:</strong> {{ record.age }}</p>
        <p><strong id="blood-label">Blood Group:</strong> {{ record.blood_group }}</p>
        <p>
         <strong id="history-label">Medical History:</strong>
         <span id="history-text">{{ record.history }}</span>
        </p>
    </div>

    <div class="record-card">
        <h3 id="checkup-title">Recent Checkup</h3>
        <p>
<span id="date-label">Date:</span>
{{ record.checkup_date }}
</p>
        <p>
<span id="doctor-label">Doctor:</span>
<span id="doctor-name">{{ record.doctor }}</span>
</p>
        <p>
<span id="status-label">Status:</span>
<span id="status-text">{{ record.status }}</span>
</p>
    </div>

</div>

<a href="/patient" class="back-btn" id="back-btn">
    Back
</a>

<script>

const translations = {

en:{
title:"Health Records",
patientDetails:"Patient Details",
name:"Name:",
age:"Age:",
blood:"Blood Group:",
history:"Medical History:",
historyText:"No major illnesses",
checkup:"Recent Checkup",
date:"Date:",
doctor:"Doctor:",
doctorName:"Dr. Ravi Kumar",
status:"Status:",
healthy:"Healthy",
back:"Back"
},

hi:{
title:"स्वास्थ्य रिकॉर्ड",
patientDetails:"मरीज विवरण",
name:"नाम:",
age:"आयु:",
blood:"ब्लड ग्रुप:",
history:"चिकित्सा इतिहास:",
historyText:"कोई बड़ी बीमारी नहीं",
checkup:"हाल की जांच",
date:"तारीख:",
doctor:"डॉक्टर:",
doctorName:"डॉ. रवि कुमार",
status:"स्थिति:",
healthy:"स्वस्थ",
back:"वापस"
},

te:{
title:"హెల్త్ రికార్డ్స్",
patientDetails:"రోగి వివరాలు",
name:"పేరు:",
age:"వయస్సు:",
blood:"రక్త గ్రూప్:",
history:"వైద్య చరిత్ర:",
historyText:"పెద్ద వ్యాధులు లేవు",
checkup:"ఇటీవలి పరీక్ష",
date:"తేదీ:",
doctor:"డాక్టర్:",
doctorName:"డా. రవి కుమార్",
status:"స్థితి:",
healthy:"ఆరోగ్యంగా ఉన్నారు",
back:"వెనక్కి"
}

};

function changeLanguage(){

let lang =
document.getElementById("languageSelect").value;

document.getElementById("title").innerText =
translations[lang].title;

document.getElementById("patient-details-title").innerText =
translations[lang].patientDetails;

document.getElementById("name-label").innerText =
translations[lang].name;

document.getElementById("age-label").innerText =
translations[lang].age;

document.getElementById("blood-label").innerText =
translations[lang].blood;

document.getElementById("history-label").innerText =
translations[lang].history;

document.getElementById("history-text").innerText =
translations[lang].historyText;

document.getElementById("checkup-title").innerText =
translations[lang].checkup;

document.getElementById("date-label").innerText =
translations[lang].date;

document.getElementById("doctor-label").innerText =
translations[lang].doctor;

document.getElementById("doctor-name").innerText =
translations[lang].doctorName;

document.getElementById("status-label").innerText =
translations[lang].status;

document.getElementById("status-text").innerText =
translations[lang].healthy;

document.getElementById("back-btn").innerText =
translations[lang].back;

localStorage.setItem("language",lang);
}

window.onload = function(){

let savedLang =
localStorage.getItem("language") || "en";

document.getElementById("languageSelect").value =
savedLang;

changeLanguage();

}

</script>

</body>
</html>
