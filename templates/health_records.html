<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Health Records</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial;
            background:#f4f7fa;
        }

        .header{
            background:linear-gradient(to right,#007bff,#00c6ff);
            color:white;
            text-align:center;
            padding:40px;
        }

        .language-box{
            margin-top:20px;
        }

        select{
            padding:10px;
            border:none;
            border-radius:5px;
            font-size:16px;
        }

        .container{
            width:80%;
            margin:40px auto;
        }

        .card{
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        h3{
            color:#007bff;
            margin-bottom:5px;
        }

        p{
            margin-top:0;
            margin-bottom:25px;
            font-size:18px;
        }

        .btn{
            background:#00c6ff;
            color:white;
            padding:12px 20px;
            text-decoration:none;
            border-radius:5px;
        }

    </style>

</head>

<body>

    <div class="header">

        <h1 id="title">Health Records</h1>

        <p id="subtitle">
            Patient Medical History and Reports
        </p>

        <div class="language-box">

            <select onchange="changeLanguage(this.value)">

                <option value="english">
                    English
                </option>

                <option value="telugu">
                    Telugu
                </option>

                <option value="hindi">
                    Hindi
                </option>

            </select>

        </div>

    </div>

    <div class="container">

        <div class="card">

            <h3 id="patient-text">
                Patient Name
            </h3>

            <p>
                {{ record.patient_name }}
            </p>

            <h3 id="doctor-text">
                Doctor Name
            </h3>

            <p>
                {{ record.doctor }}
            </p>

            <h3 id="disease-text">
                Disease
            </h3>

            <p>
                {{ record.disease }}
            </p>

            <h3 id="medicine-text">
                Medicine
            </h3>

            <p>
                {{ record.medicine }}
            </p>

            <h3 id="date-text">
                Appointment Date
            </h3>

            <p>
                {{ record.date }}
            </p>

            <br>

            <a href="/patient"
               class="btn"
               id="back-btn">

               Back to Dashboard

            </a>

        </div>

    </div>

<script>

function changeLanguage(language){

    // TELUGU
    if(language == "telugu"){

        document.getElementById("title").innerHTML =
        "ఆరోగ్య రికార్డులు";

        document.getElementById("subtitle").innerHTML =
        "రోగి వైద్య చరిత్ర మరియు నివేదికలు";

        document.getElementById("patient-text").innerHTML =
        "రోగి పేరు";

        document.getElementById("doctor-text").innerHTML =
        "డాక్టర్ పేరు";

        document.getElementById("disease-text").innerHTML =
        "వ్యాధి";

        document.getElementById("medicine-text").innerHTML =
        "మందు";

        document.getElementById("date-text").innerHTML =
        "అపాయింట్మెంట్ తేదీ";

        document.getElementById("back-btn").innerHTML =
        "డాష్‌బోర్డ్‌కు తిరిగి వెళ్ళు";
    }

    // HINDI
    else if(language == "hindi"){

        document.getElementById("title").innerHTML =
        "स्वास्थ्य रिकॉर्ड";

        document.getElementById("subtitle").innerHTML =
        "रोगी चिकित्सा इतिहास और रिपोर्ट";

        document.getElementById("patient-text").innerHTML =
        "रोगी का नाम";

        document.getElementById("doctor-text").innerHTML =
        "डॉक्टर का नाम";

        document.getElementById("disease-text").innerHTML =
        "बीमारी";

        document.getElementById("medicine-text").innerHTML =
        "दवाई";

        document.getElementById("date-text").innerHTML =
        "अपॉइंटमेंट तारीख";

        document.getElementById("back-btn").innerHTML =
        "डैशबोर्ड पर वापस जाएं";
    }

    // ENGLISH
    else{

        document.getElementById("title").innerHTML =
        "Health Records";

        document.getElementById("subtitle").innerHTML =
        "Patient Medical History and Reports";

        document.getElementById("patient-text").innerHTML =
        "Patient Name";

        document.getElementById("doctor-text").innerHTML =
        "Doctor Name";

        document.getElementById("disease-text").innerHTML =
        "Disease";

        document.getElementById("medicine-text").innerHTML =
        "Medicine";

        document.getElementById("date-text").innerHTML =
        "Appointment Date";

        document.getElementById("back-btn").innerHTML =
        "Back to Dashboard";
    }
}

</script>

</body>
</html>
