<!DOCTYPE html>
<html>
<head>
    <title>Voice Assistant - RuralCareHub</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f7fb;
            text-align:center;
            margin:0;
        }

        .header{
            background:#0077cc;
            color:white;
            padding:20px;
        }

        .card{
            background:white;
            width:90%;
            margin:40px auto;
            padding:25px;
            border-radius:10px;
            box-shadow:0 3px 10px rgba(0,0,0,0.1);
        }

        select{
            padding:10px;
            margin-bottom:20px;
        }

        button{
            background:#28a745;
            color:white;
            padding:15px 20px;
            border:none;
            border-radius:10px;
            font-size:18px;
            width:100%;
            cursor:pointer;
        }

        #output{
            margin-top:20px;
            font-size:20px;
            color:#333;
        }

    </style>
</head>

<body>

<div class="header">
    <h1 id="title">Voice Assistant</h1>
</div>

<div class="card">

    <select id="languageSelect" onchange="changeLanguage()">

        <option value="en">English</option>

        <option value="te">Telugu</option>

        <option value="hi">Hindi</option>

    </select>

    <h2 id="subtitle">🎤 Tap & Speak</h2>

    <button id="speak-btn" onclick="startVoice()">
        🎙 Start Speaking
    </button>

    <p id="output">Press button and speak...</p>

</div>

<script>

const translations = {

    en:{
        title:"Voice Assistant",
        subtitle:"🎤 Tap & Speak",
        button:"🎙 Start Speaking",
        output:"Press button and speak...",

        fever:"You may have fever. Drink plenty of water, take rest, and consult doctor if fever continues.",

        headache:"Take proper rest, avoid mobile screen, and drink enough water.",

        cold:"Drink warm water, avoid cold foods, and take enough rest.",

        doctor:"You can book doctor appointment in the app for better treatment.",

        hospital:"Nearest hospital details are available in Emergency Services section.",

        help:"I am here to help you with healthcare information.",

        cough:"Drink warm water and avoid cool drinks.",

        water:"Drink at least 3 to 4 liters of clean water daily.",

        food:"Eat healthy vegetables, fruits, and nutritious food daily.",

        unknown:"Sorry, I did not understand."
    },

    te:{
        title:"వాయిస్ అసిస్టెంట్",
        subtitle:"🎤 నొక్కి మాట్లాడండి",
        button:"🎙 మాట్లాడటం ప్రారంభించండి",
        output:"బటన్ నొక్కి మాట్లాడండి...",

        fever:"మీకు జ్వరం ఉండవచ్చు. ఎక్కువ నీరు తాగండి మరియు విశ్రాంతి తీసుకోండి.",

        headache:"తలనొప్పికి విశ్రాంతి తీసుకోండి మరియు ఎక్కువ నీరు తాగండి.",

        cold:"వెచ్చని నీరు తాగండి మరియు చల్లని పదార్థాలు తినవద్దు.",

        doctor:"మంచి చికిత్స కోసం యాప్‌లో డాక్టర్ అపాయింట్మెంట్ బుక్ చేసుకోండి.",

        hospital:"సమీప ఆసుపత్రి వివరాలు ఎమర్జెన్సీ సర్వీసెస్‌లో అందుబాటులో ఉన్నాయి.",

        help:"నేను మీకు ఆరోగ్య సమాచారంతో సహాయం చేయడానికి ఇక్కడ ఉన్నాను.",

        cough:"వెచ్చని నీరు తాగండి మరియు చల్లని పానీయాలు తాగవద్దు.",

        water:"రోజుకు 3 నుండి 4 లీటర్ల శుభ్రమైన నీరు తాగండి.",

        food:"ఆరోగ్యకరమైన కూరగాయలు మరియు పండ్లు తినండి.",

        unknown:"క్షమించండి, నాకు అర్థం కాలేదు."
    },

    hi:{
        title:"वॉइस असिस्टेंट",
        subtitle:"🎤 दबाकर बोलें",
        button:"🎙 बोलना शुरू करें",
        output:"बटन दबाकर बोलें...",

        fever:"आपको बुखार हो सकता है। अधिक पानी पिएं और आराम करें।",

        headache:"सिरदर्द के लिए आराम करें और अधिक पानी पिएं।",

        cold:"गर्म पानी पिएं और ठंडी चीजें खाने से बचें।",

        doctor:"बेहतर इलाज के लिए ऐप में डॉक्टर अपॉइंटमेंट बुक करें।",

        hospital:"नजदीकी अस्पताल की जानकारी इमरजेंसी सर्विस में उपलब्ध है।",

        help:"मैं आपकी स्वास्थ्य जानकारी में मदद करने के लिए यहाँ हूँ।",

        cough:"गर्म पानी पिएं और ठंडे पेय से बचें।",

        water:"रोजाना 3 से 4 लीटर साफ पानी पिएं।",

        food:"स्वस्थ सब्जियां और फल खाएं।",

        unknown:"माफ कीजिए, मुझे समझ नहीं आया।"
    }

};

function changeLanguage(){

    let lang =
    document.getElementById("languageSelect").value;

    document.getElementById("title").innerText =
    translations[lang].title;

    document.getElementById("subtitle").innerText =
    translations[lang].subtitle;

    document.getElementById("speak-btn").innerText =
    translations[lang].button;

    document.getElementById("output").innerText =
    translations[lang].output;

    localStorage.setItem("language", lang);
}

function startVoice(){

    let SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        document.getElementById("output").innerText =
        "Voice Recognition not supported.";

        return;
    }

    let recognition = new SpeechRecognition();

    let selectedLang =
    document.getElementById("languageSelect").value;

    if(selectedLang == "te"){
        recognition.lang = "te-IN";
    }

    else if(selectedLang == "hi"){
        recognition.lang = "hi-IN";
    }

    else{
        recognition.lang = "en-US";
    }

    recognition.interimResults = false;
    recognition.continuous = false;

    document.getElementById("output").innerText =
    "Listening... 🎧";

    recognition.start();

    recognition.onresult = function(event){

        let text =
        event.results[0][0].transcript.toLowerCase();

        let response = "";

        // FEVER
        if(
            text.includes("fever") ||
            text.includes("జ్వరం") ||
            text.includes("बुखार")
        ){

            response =
            translations[selectedLang].fever;
        }

        // HEADACHE
        else if(
            text.includes("headache") ||
            text.includes("తలనొప్పి") ||
            text.includes("सिरदर्द")
        ){

            response =
            translations[selectedLang].headache;
        }

        // COLD
        else if(
            text.includes("cold") ||
            text.includes("జలుబు") ||
            text.includes("सर्दी")
        ){

            response =
            translations[selectedLang].cold;
        }

        // DOCTOR
        else if(
            text.includes("doctor") ||
            text.includes("డాక్టర్") ||
            text.includes("डॉक्टर")
        ){

            response =
            translations[selectedLang].doctor;
        }

        // HOSPITAL
        else if(
            text.includes("hospital") ||
            text.includes("హాస్పిటల్") ||
            text.includes("अस्पताल")
        ){

            response =
            translations[selectedLang].hospital;
        }

        // HELP
        else if(
            text.includes("help") ||
            text.includes("సహాయం") ||
            text.includes("मदद")
        ){

            response =
            translations[selectedLang].help;
        }

        // COUGH
        else if(
            text.includes("cough") ||
            text.includes("దగ్గు") ||
            text.includes("खांसी")
        ){

            response =
            translations[selectedLang].cough;
        }

        // WATER
        else if(
            text.includes("water") ||
            text.includes("నీరు") ||
            text.includes("पानी")
        ){

            response =
            translations[selectedLang].water;
        }

        // FOOD
        else if(
            text.includes("food") ||
            text.includes("ఆహారం") ||
            text.includes("भोजन")
        ){

            response =
            translations[selectedLang].food;
        }

        else{

            response =
            translations[selectedLang].unknown;
        }

        document.getElementById("output").innerText =
        response;

        let reply =
        new SpeechSynthesisUtterance(response);

        if(selectedLang == "te"){
            reply.lang = "te-IN";
        }

        else if(selectedLang == "hi"){
            reply.lang = "hi-IN";
        }

        else{
            reply.lang = "en-US";
        }

        reply.rate = 1;
        reply.pitch = 1;

        window.speechSynthesis.speak(reply);
    };

    recognition.onerror = function(){

        document.getElementById("output").innerText =
        "Error occurred. Please try again.";
    };
}

window.onload = function(){

    let savedLang =
    localStorage.getItem("language") || "en";

    document.getElementById("languageSelect").value =
    savedLang;

    changeLanguage();
}

</script>

</body>
</html>
