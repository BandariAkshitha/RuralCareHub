<!DOCTYPE html>
<html>
<head>
    <title>Admin Feedback</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f7fa;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .container {
            width: 80%;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .feedback {
            border-bottom: 1px solid #ddd;
            padding: 10px;
        }

        .name {
            font-weight: bold;
        }

        .lang-box {
            text-align: center;
            margin-bottom: 15px;
        }

        button {
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
        }
    </style>

    <script>
        function setLang(lang) {
            const en = document.getElementsByClassName("en");
            const te = document.getElementsByClassName("te");
            const hi = document.getElementsByClassName("hi");

            for (let i = 0; i < en.length; i++) {
                en[i].style.display = (lang === "en") ? "block" : "none";
                te[i].style.display = (lang === "te") ? "block" : "none";
                hi[i].style.display = (lang === "hi") ? "block" : "none";
            }
        }
    </script>

</head>

<body onload="setLang('en')">

    <h1>Feedback Management</h1>

    <!-- LANGUAGE BUTTONS -->
    <div class="lang-box">
        <button onclick="setLang('en')">English</button>
        <button onclick="setLang('te')">తెలుగు</button>
        <button onclick="setLang('hi')">हिन्दी</button>
    </div>

    <div class="container">

        {% for f in feedbacks %}

        <div class="feedback">

            <!-- ENGLISH -->
            <div class="en">
                <div class="name">👤 {{ f.name }}</div>
                <div>⭐ Rating: {{ f.rating }}</div>
                <div>💬 {{ f.comment }}</div>
            </div>

            <!-- TELUGU -->
            <div class="te" style="display:none;">
                <div class="name">👤 {{ f.name }}</div>
                <div>⭐ రేటింగ్: {{ f.rating }}</div>
                <div>💬 {{ f.comment }}</div>
            </div>

            <!-- HINDI -->
            <div class="hi" style="display:none;">
                <div class="name">👤 {{ f.name }}</div>
                <div>⭐ रेटिंग: {{ f.rating }}</div>
                <div>💬 {{ f.comment }}</div>
            </div>

        </div>

        {% endfor %}

    </div>

</body>
</html>
