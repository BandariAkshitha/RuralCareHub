<!DOCTYPE html>
<html>

<head>

    <title>
        Upload Reports
    </title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <style>

        body{
            font-family:Arial;
            background:#f4f7fb;
            margin:0;
        }

        .header{
            background:#0077cc;
            color:white;
            text-align:center;
            padding:20px;
        }

        .container{
            width:50%;
            margin:40px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            text-align:center;
        }

        input{
            margin-top:20px;
        }

        button{
            margin-top:20px;
            padding:12px 20px;
            background:#28a745;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        .back-btn{
            display:block;
            width:120px;
            margin:20px auto;
            text-align:center;
            padding:10px;
            background:#0077cc;
            color:white;
            text-decoration:none;
            border-radius:5px;
        }

    </style>

</head>

<body>

<div class="header">

    <h1 id="title">
        🧾 Upload Reports
    </h1>

    <br>

    <select id="languageSelect"
            onchange="changeLanguage()">

        <option value="en">
            English
        </option>

        <option value="te">
            Telugu
        </option>

        <option value="hi">
            Hindi
        </option>

    </select>

</div>

<div class="container">

<form>

    <input type="file">

    <br>

    <button type="submit"
            id="upload-btn">

        Upload Report

    </button>

</form>

</div>

<a href="/doctor"
   class="back-btn"
   id="back-btn">

   Back

</a>

<script>

const translations = {

    en:{
        title:"🧾 Upload Reports",
        upload:"Upload Report",
        back:"Back"
    },

    te:{
        title:"🧾 రిపోర్టులు అప్లోడ్",
        upload:"రిపోర్ట్ అప్లోడ్ చేయండి",
        back:"వెనక్కి"
    },

    hi:{
        title:"🧾 रिपोर्ट अपलोड करें",
        upload:"रिपोर्ट अपलोड करें",
        back:"वापस"
    }
};

function changeLanguage(){

    let lang =
    document.getElementById("languageSelect").value;

    document.getElementById("title").innerText =
    translations[lang].title;

    document.getElementById("upload-btn").innerText =
    translations[lang].upload;

    document.getElementById("back-btn").innerText =
    translations[lang].back;
}

</script>

</body>
</html>
