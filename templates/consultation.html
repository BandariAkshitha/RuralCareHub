<!DOCTYPE html>
<html>
<head>

<title>Video Consultation</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f4f7fa;
}

.header{
    background:linear-gradient(to right,#0052d4,#00c6ff);
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:90%;
    margin:auto;
    margin-top:30px;
    text-align:center;
}

iframe{
    width:100%;
    height:500px;
    border:none;
    border-radius:12px;
}

.back-btn{
    display:inline-block;
    margin-top:20px;
    background:#0052d4;
    color:white;
    padding:10px 20px;
    text-decoration:none;
    border-radius:8px;
}

</style>

</head>

<body>

<div class="header">

<h1 id="title">
Video Consultation
</h1>

<p id="subtitle">
Online Video Meeting
</p>

<select id="languageSelect"
onchange="changeLanguage()">

<option value="en">English</option>
<option value="hi">Hindi</option>
<option value="te">Telugu</option>

</select>

</div>

<div class="container">

<iframe
src="https://meet.jit.si/RuralCareHub">
</iframe>

<a href="/doctor"
class="back-btn"
id="back-btn">

Back to Dashboard

</a>

</div>

<script>

const translations = {

en:{
title:"Video Consultation",
subtitle:"Online Video Meeting",
back:"Back to Dashboard"
},

hi:{
title:"वीडियो परामर्श",
subtitle:"ऑनलाइन वीडियो मीटिंग",
back:"डैशबोर्ड पर वापस जाएं"
},

te:{
title:"వీడియో సంప్రదింపు",
subtitle:"ఆన్‌లైన్ వీడియో సమావేశం",
back:"డాష్‌బోర్డ్‌కు తిరిగి వెళ్ళు"
}

};

function applyLanguage(){

let lang =
localStorage.getItem("language") || "en";

document.getElementById("title").innerText =
translations[lang].title;

document.getElementById("subtitle").innerText =
translations[lang].subtitle;

document.getElementById("back-btn").innerText =
translations[lang].back;

}

function changeLanguage(){

let lang =
document.getElementById("languageSelect").value;

localStorage.setItem("language", lang);

applyLanguage();

}

window.onload = function(){

let savedLang =
localStorage.getItem("language") || "en";

document.getElementById("languageSelect").value =
savedLang;

applyLanguage();

};

</script>

</body>
</html>
