<!DOCTYPE html>
<html>

<head>

<title>Appointment Booking - RuralCareHub</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial,sans-serif;
background:#f4f7fb;
margin:0;
}

.header{
background:#0077cc;
color:white;
text-align:center;
padding:20px;
}

.container{
width:50%;
margin:30px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

label{
font-weight:bold;
}

input,select{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:5px;
box-sizing:border-box;
}

.btn{
width:100%;
padding:12px;
background:#28a745;
color:white;
border:none;
border-radius:5px;
font-size:16px;
cursor:pointer;
}

.back-btn{
display:block;
width:150px;
margin:20px auto;
padding:10px;
text-align:center;
background:#0077cc;
color:white;
text-decoration:none;
border-radius:5px;
}

</style>

</head>

<body>

<div class="header">

<h1 id="title">Appointment Booking</h1>

<select id="languageSelect" onchange="changeLanguage()">
<option value="en">English</option>
<option value="hi">Hindi</option>
<option value="te">Telugu</option>
</select>

</div>

<div class="container">

<form action="/appointment" method="POST">

<label id="patient-label">Patient Name</label>
<input type="text" name="patient_name" required>

<label id="symptoms-label">Symptoms</label>

<select id="symptomSelect" name="symptoms" onchange="selectDoctor()" required>
<option value="">Select Symptoms</option>

<option value="Fever">Fever</option>
<option value="Cold">Cold</option>
<option value="Cough">Cough</option>
<option value="Headache">Headache</option>
<option value="Body Pain">Body Pain</option>
<option value="Stomach Pain">Stomach Pain</option>

</select>

<label id="doctor-label">Doctor</label>

<select id="doctorSelect" name="doctor_name" required>

<option value="Dr. Ravi Kumar">Dr. Ravi Kumar</option>
<option value="Dr. Priya Sharma">Dr. Priya Sharma</option>
<option value="Dr. Suresh Reddy">Dr. Suresh Reddy</option>
<option value="Dr. Anjali Mehta">Dr. Anjali Mehta</option>
<option value="Dr. Kiran Rao">Dr. Kiran Rao</option>
<option value="Dr. Nandini Iyer">Dr. Nandini Iyer</option>
<option value="Dr. Arjun Reddy">Dr. Arjun Reddy</option>
<option value="Dr. Sneha Varma">Dr. Sneha Varma</option>
<option value="Dr. Meera Joshi">Dr. Meera Joshi</option>
<option value="Dr. Vikram Singh">Dr. Vikram Singh</option>

</select>

<label id="age-label">Age</label>
<input type="number" name="age" required>

<label id="blood-label">Blood Group</label>
<select name="blood_group" required>
<option>A+</option><option>A-</option>
<option>B+</option><option>B-</option>
<option>AB+</option><option>AB-</option>
<option>O+</option><option>O-</option>
</select>

<label id="date-label">Appointment Date</label>
<input type="date" name="appointment_date" required>

<label id="time-label">Appointment Time</label>
<input type="time" name="appointment_time" required>

<button class="btn" id="book-btn" type="submit">Book Appointment</button>

</form>

</div>

<a href="/patient" class="back-btn" id="back-btn">Back</a>

<script>

// AUTO DOCTOR SELECTION
function selectDoctor(){

let symptom = document.getElementById("symptomSelect").value;
let doctor = document.getElementById("doctorSelect");

if(symptom=="Fever"||symptom=="Cold"||symptom=="Cough"){
    doctor.value="Dr. Ravi Kumar";
}
else if(symptom=="Headache"){
    doctor.value="Dr. Priya Sharma";
}
else if(symptom=="Body Pain"||symptom=="Stomach Pain"){
    doctor.value="Dr. Suresh Reddy";
}

}

// FULL TRANSLATIONS
const translations = {

en:{
title:"Appointment Booking",
patient:"Patient Name",
symptoms:"Symptoms",
doctor:"Doctor",
age:"Age",
blood:"Blood Group",
date:"Appointment Date",
time:"Appointment Time",
book:"Book Appointment",
back:"Back",

symptomsList:[
"Select Symptoms",
"Fever",
"Cold",
"Cough",
"Headache",
"Body Pain",
"Stomach Pain"
],

doctors:[
"Dr. Ravi Kumar","Dr. Priya Sharma","Dr. Suresh Reddy",
"Dr. Anjali Mehta","Dr. Kiran Rao","Dr. Nandini Iyer",
"Dr. Arjun Reddy","Dr. Sneha Varma","Dr. Meera Joshi",
"Dr. Vikram Singh"
]
},

hi:{
title:"अपॉइंटमेंट बुकिंग",
patient:"मरीज का नाम",
symptoms:"लक्षण",
doctor:"डॉक्टर",
age:"आयु",
blood:"रक्त समूह",
date:"तारीख",
time:"समय",
book:"अपॉइंटमेंट बुक करें",
back:"वापस",

symptomsList:[
"लक्षण चुनें",
"बुखार",
"सर्दी",
"खांसी",
"सिरदर्द",
"शरीर दर्द",
"पेट दर्द"
],

doctors:[
"डॉ. रवि कुमार","डॉ. प्रिया शर्मा","डॉ. सुरेश रेड्डी",
"डॉ. अंजलि मेहता","डॉ. किरण राव","डॉ. नंदिनी अय्यर",
"डॉ. अर्जुन रेड्डी","डॉ. स्नेहा वर्मा","डॉ. मीरा जोशी",
"डॉ. विक्रम सिंह"
]
},

te:{
title:"అపాయింట్మెంట్ బుకింగ్",
patient:"రోగి పేరు",
symptoms:"లక్షణాలు",
doctor:"డాక్టర్",
age:"వయస్సు",
blood:"రక్త గ్రూప్",
date:"తేదీ",
time:"సమయం",
book:"బుక్ చేయండి",
back:"వెనక్కి",

symptomsList:[
"లక్షణాలు ఎంచుకోండి",
"జ్వరం",
"జలుబు",
"దగ్గు",
"తలనొప్పి",
"శరీర నొప్పి",
"కడుపు నొప్పి"
],

doctors:[
"డా. రవి కుమార్","డా. ప్రియా శర్మ","డా. సురేష్ రెడ్డి",
"డా. అంజలి మేథా","డా. కిరణ్ రావు","డా. నందిని అయ్యర్",
"డా. అర్జున్ రెడ్డి","డా. స్నేహా వర్మ","డా. మీరా జోషి",
"డా. విక్రమ్ సింగ్"
]
}

};

function changeLanguage(){

let lang = document.getElementById("languageSelect").value;

document.getElementById("title").innerText = translations[lang].title;
document.getElementById("patient-label").innerText = translations[lang].patient;
document.getElementById("symptoms-label").innerText = translations[lang].symptoms;
document.getElementById("doctor-label").innerText = translations[lang].doctor;
document.getElementById("age-label").innerText = translations[lang].age;
document.getElementById("blood-label").innerText = translations[lang].blood;
document.getElementById("date-label").innerText = translations[lang].date;
document.getElementById("time-label").innerText = translations[lang].time;
document.getElementById("book-btn").innerText = translations[lang].book;
document.getElementById("back-btn").innerText = translations[lang].back;

// SYMPTOMS
let symptomSelect = document.getElementById("symptomSelect");
for(let i=0;i<symptomSelect.options.length-1;i++){
    symptomSelect.options[i+1].innerText = translations[lang].symptomsList[i];
}

// DOCTORS
let doctorSelect = document.getElementById("doctorSelect");
for(let i=0;i<doctorSelect.options.length;i++){
    doctorSelect.options[i].innerText = translations[lang].doctors[i];
}

localStorage.setItem("language",lang);

}

window.onload = function(){
let lang = localStorage.getItem("language") || "en";
document.getElementById("languageSelect").value = lang;
changeLanguage();
}

</script>

</body>
</html>
