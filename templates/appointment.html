<!DOCTYPE html>
<html>

<head>

<title>Appointment Booking - RuralCareHub</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial,sans-serif;
background:#f4f7fb;
margin:0;
}

.header{
background:#0077cc;
color:white;
text-align:center;
padding:20px;
}

.container{
width:50%;
margin:30px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

label{
font-weight:bold;
}

input,select{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:5px;
box-sizing:border-box;
}

.btn{
width:100%;
padding:12px;
background:#28a745;
color:white;
border:none;
border-radius:5px;
font-size:16px;
cursor:pointer;
}

.btn:hover{
background:#218838;
}

.back-btn{
display:block;
width:150px;
margin:20px auto;
padding:10px;
text-align:center;
background:#0077cc;
color:white;
text-decoration:none;
border-radius:5px;
}

@media(max-width:768px){
.container{
width:90%;
}
}

</style>

</head>

<body>

<div class="header">

<h1 id="title">Appointment Booking</h1>

<select id="languageSelect" onchange="changeLanguage()">

<option value="en">English</option>
<option value="te">Telugu</option>
<option value="hi">Hindi</option>

</select>

</div>

<div class="container">

<form action="/appointment" method="POST">

<label id="patient-label">Patient Name</label>

<input type="text" name="patient_name" placeholder="Enter Patient Name" required>

<label id="symptoms-label">Symptoms</label>

<select id="symptomSelect" name="symptoms" onchange="selectDoctor()" required>

<option value="">Select Symptoms</option>
<option value="Fever">Fever</option>
<option value="Cold">Cold</option>
<option value="Cough">Cough</option>
<option value="Headache">Headache</option>
<option value="Body Pain">Body Pain</option>
<option value="Stomach Pain">Stomach Pain</option>

</select>

<label id="doctor-label">Doctor</label>

<select id="doctorSelect" name="doctor_name" required>

<option value="Dr. Ravi Kumar">Dr. Ravi Kumar</option>
<option value="Dr. Priya Sharma">Dr. Priya Sharma</option>
<option value="Dr. Suresh Reddy">Dr. Suresh Reddy</option>

</select>

</select>
<label id="age-label">Age</label>
<input type="number" name="age" required>

<label id="blood-label">Blood Group</label>
<select name="blood_group" required>
    <option value="">Select Blood Group</option>
    <option value="A+">A+</option>
    <option value="A-">A-</option>
    <option value="B+">B+</option>
    <option value="B-">B-</option>
    <option value="AB+">AB+</option>
    <option value="AB-">AB-</option>
    <option value="O+">O+</option>
    <option value="O-">O-</option>
</select>

<label id="date-label">Appointment Date</label>
<input type="date" name="appointment_date" required>

<label id="time-label">Appointment Time</label>

<input type="time" name="appointment_time" required>

<button class="btn" id="book-btn" type="submit">

Book Appointment

</button>

</form>

</div>

<a href="/patient" class="back-btn" id="back-btn">

Back

</a>

<script>

function selectDoctor(){

let symptom=document.getElementById("symptomSelect").value;

let doctor=document.getElementById("doctorSelect");

if(symptom=="Fever"||symptom=="Cold"||symptom=="Cough"){

doctor.value="Dr. Ravi Kumar";

}

else if(symptom=="Headache"){

doctor.value="Dr. Priya Sharma";

}

else if(symptom=="Body Pain"||symptom=="Stomach Pain"){

doctor.value="Dr. Suresh Reddy";

}

}

const translations={

en:{
title:"Appointment Booking",
patient:"Patient Name",
symptoms:"Symptoms",
doctor:"Doctor",
age:"Age",
blood:"Blood Group",
date:"Appointment Date",
time:"Appointment Time",
book:"Book Appointment",
back:"Back"
},

te:{
title:"అపాయింట్మెంట్ బుకింగ్",
patient:"రోగి పేరు",
symptoms:"లక్షణాలు",
doctor:"డాక్టర్",
age:"వయస్సు",
blood:"రక్త గ్రూప్",
date:"అపాయింట్మెంట్ తేదీ",
time:"అపాయింట్మెంట్ సమయం",
book:"అపాయింట్మెంట్ బుక్ చేయండి",
back:"వెనక్కి"
},

hi:{
title:"अपॉइंटमेंट बुकिंग",
patient:"मरीज का नाम",
symptoms:"लक्षण",
doctor:"डॉक्टर",
age:"आयु",
blood:"रक्त समूह",
date:"अपॉइंटमेंट तिथि",
time:"अपॉइंटमेंट समय",
book:"अपॉइंटमेंट बुक करें",
back:"वापस"
}

};

function changeLanguage(){

let lang=document.getElementById("languageSelect").value;

document.getElementById("title").innerHTML=translations[lang].title;
document.getElementById("patient-label").innerHTML=translations[lang].patient;
document.getElementById("symptoms-label").innerHTML=translations[lang].symptoms;
document.getElementById("doctor-label").innerHTML=translations[lang].doctor;
document.getElementById("date-label").innerHTML=translations[lang].date;
document.getElementById("time-label").innerHTML=translations[lang].time;
document.getElementById("age-label").innerHTML = translations[lang].age;
document.getElementById("blood-label").innerHTML = translations[lang].blood;
document.getElementById("book-btn").innerHTML=translations[lang].book;
document.getElementById("back-btn").innerHTML=translations[lang].back;

localStorage.setItem("language",lang);

}

window.onload=function(){

let lang=localStorage.getItem("language")||"en";

document.getElementById("languageSelect").value=lang;

changeLanguage();

}

function bookAppointment(doctorName) {

    localStorage.setItem(
        "appointmentNotification",
        "Your appointment with " + doctorName + " has been confirmed."
    );

    alert("Appointment booked successfully!");

    window.location.href = "/notifications";
}
</script>

</body>
</html>
